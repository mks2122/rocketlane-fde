<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380"><defs><marker id="a1f4e8c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e8c"/></marker><marker id="ac62828" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="a2e7d32" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="ab26a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b26a00"/></marker><marker id="a5b6675" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/></marker></defs><rect x="18" y="30" width="132" height="92" rx="6" fill="#ffffff" stroke="#1f4e8c" stroke-width="1.4"/><text x="84.0" y="60.4375" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1b2430" text-anchor="middle">Gmail inbox</text><text x="84.0" y="74.5625" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6675" text-anchor="middle">polled every 30 s,</text><text x="84.0" y="88.0625" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6675" text-anchor="middle">allow-listed senders,</text><text x="84.0" y="101.5625" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6675" text-anchor="middle">each email once</text><circle cx="32" cy="44" r="9" fill="#1f4e8c"/><text x="32" y="47.8" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><path d="M150,76.0 L163,76.0" fill="none" stroke="#1f4e8c" stroke-width="1.4" marker-end="url(#a1f4e8c)"/><rect x="163" y="30" width="132" height="92" rx="6" fill="#ffffff" stroke="#1f4e8c" stroke-width="1.4"/><text x="229.0" y="60.4375" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1b2430" text-anchor="middle">Intake Agent</text><text x="229.0" y="74.5625" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6675" text-anchor="middle">extracts fields with</text><text x="229.0" y="88.0625" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6675" text-anchor="middle">evidence quotes;</text><text x="229.0" y="101.5625" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6675" text-anchor="middle">code validates them</text><circle cx="177" cy="44" r="9" fill="#1f4e8c"/><text x="177" y="47.8" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><path d="M295,76.0 L308,76.0" fill="none" stroke="#1f4e8c" stroke-width="1.4" marker-end="url(#a1f4e8c)"/><rect x="308" y="30" width="132" height="92" rx="6" fill="#ffffff" stroke="#1f4e8c" stroke-width="1.4"/><text x="374.0" y="60.4375" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1b2430" text-anchor="middle">Voice call (Vapi)</text><text x="374.0" y="74.5625" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6675" text-anchor="middle">AE confirms the tier;</text><text x="374.0" y="88.0625" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6675" text-anchor="middle">transcript re-checked;</text><text x="374.0" y="101.5625" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6675" text-anchor="middle">both must agree</text><circle cx="322" cy="44" r="9" fill="#1f4e8c"/><text x="322" y="47.8" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><path d="M440,76.0 L453,76.0" fill="none" stroke="#1f4e8c" stroke-width="1.4" marker-end="url(#a1f4e8c)"/><rect x="453" y="30" width="132" height="92" rx="6" fill="#ffffff" stroke="#1f4e8c" stroke-width="1.4"/><text x="519.0" y="60.4375" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1b2430" text-anchor="middle">Rocketlane</text><text x="519.0" y="74.5625" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6675" text-anchor="middle">duplicate check, then</text><text x="519.0" y="88.0625" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6675" text-anchor="middle">project from the tier</text><text x="519.0" y="101.5625" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6675" text-anchor="middle">template + CSM</text><circle cx="467" cy="44" r="9" fill="#1f4e8c"/><text x="467" y="47.8" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><path d="M585,76.0 L598,76.0" fill="none" stroke="#1f4e8c" stroke-width="1.4" marker-end="url(#a1f4e8c)"/><rect x="598" y="30" width="132" height="92" rx="6" fill="#ffffff" stroke="#1f4e8c" stroke-width="1.4"/><text x="664.0" y="60.4375" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1b2430" text-anchor="middle">Comms Agent</text><text x="664.0" y="74.5625" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6675" text-anchor="middle">Slack channel, topic</text><text x="664.0" y="88.0625" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6675" text-anchor="middle">and welcome; code</text><text x="664.0" y="101.5625" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6675" text-anchor="middle">validates the copy</text><circle cx="612" cy="44" r="9" fill="#1f4e8c"/><text x="612" y="47.8" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><path d="M84.0,122 L84.0,160" fill="none" stroke="#b26a00" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ab26a00)"/><rect x="18" y="160" width="132" height="70" rx="6" fill="#fff4d6" stroke="#b26a00" stroke-width="1.4"/><text x="84.0" y="185.75" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6675" text-anchor="middle">unknown sender or</text><text x="84.0" y="199.25" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6675" text-anchor="middle">not a deal:</text><text x="84.0" y="212.75" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6675" text-anchor="middle">recorded, ignored</text><path d="M229.0,122 L229.0,160" fill="none" stroke="#b26a00" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ab26a00)"/><rect x="163" y="160" width="132" height="70" rx="6" fill="#fff4d6" stroke="#b26a00" stroke-width="1.4"/><text x="229.0" y="185.75" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6675" text-anchor="middle">missing or invalid</text><text x="229.0" y="199.25" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6675" text-anchor="middle">fields: ask the AE,</text><text x="229.0" y="212.75" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6675" text-anchor="middle">remind after 24 h</text><path d="M374.0,122 L374.0,160" fill="none" stroke="#b26a00" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ab26a00)"/><rect x="308" y="160" width="132" height="70" rx="6" fill="#fff4d6" stroke="#b26a00" stroke-width="1.4"/><text x="374.0" y="185.75" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6675" text-anchor="middle">no answer or unclear:</text><text x="374.0" y="199.25" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6675" text-anchor="middle">retry up to 3 times</text><text x="374.0" y="212.75" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6675" text-anchor="middle">in business hours</text><path d="M519.0,122 L519.0,160" fill="none" stroke="#b26a00" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ab26a00)"/><rect x="453" y="160" width="132" height="70" rx="6" fill="#fff4d6" stroke="#b26a00" stroke-width="1.4"/><text x="519.0" y="185.75" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6675" text-anchor="middle">API down: retry 1/5/15 min;</text><text x="519.0" y="199.25" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6675" text-anchor="middle">existing project:</text><text x="519.0" y="212.75" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6675" text-anchor="middle">hold, never duplicate</text><path d="M664.0,122 L664.0,160" fill="none" stroke="#b26a00" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ab26a00)"/><rect x="598" y="160" width="132" height="70" rx="6" fill="#fff4d6" stroke="#b26a00" stroke-width="1.4"/><text x="664.0" y="185.75" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6675" text-anchor="middle">Slack down: resume</text><text x="664.0" y="199.25" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6675" text-anchor="middle">from last step; LLM</text><text x="664.0" y="212.75" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6675" text-anchor="middle">down: standard text</text><path d="M229.0,230 L229.0,268" fill="none" stroke="#c62828" stroke-width="1.3" marker-end="url(#ac62828)"/><path d="M374.0,230 L374.0,268" fill="none" stroke="#c62828" stroke-width="1.3" marker-end="url(#ac62828)"/><path d="M519.0,230 L519.0,268" fill="none" stroke="#c62828" stroke-width="1.3" marker-end="url(#ac62828)"/><path d="M664.0,230 L664.0,268" fill="none" stroke="#c62828" stroke-width="1.3" marker-end="url(#ac62828)"/><rect x="18" y="268" width="712" height="44" rx="6" fill="#fdecea" stroke="#c62828" stroke-width="1.4"/><text x="380" y="286" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#c62828" text-anchor="middle">Human escalation: CS Manager notified by email and in #cs-escalations</text><text x="380" y="302" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#1b2430" text-anchor="middle">with what happened and what was tried; resolved through the operations API (confirm tier, retry, dismiss)</text><rect x="18" y="326" width="712" height="40" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.4"/><text x="380" y="343" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#2e7d32" text-anchor="middle">Inside Rocketlane, after the project exists</text><text x="380" y="358" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#1b2430" text-anchor="middle">Task overdue 1 day: notify Project Manager · 4 days: notify Project Owner · migration verified: customer approval requested</text><text x="18" y="20" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1f4e8c" text-anchor="start">Happy path</text><text x="92.0" y="152" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#b26a00" text-anchor="start">Exception handling</text></svg>
