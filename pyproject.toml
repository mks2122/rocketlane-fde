[project]
name = "novacrm-onboarding-agents"
version = "0.1.0"
description = "Multi-agent customer onboarding automation (Rocketlane FDE take-home)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "openai-agents>=0.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "sqlmodel>=0.0.22",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "tenacity>=9.0",
    "structlog>=24.4",
    "pyyaml>=6.0",
    "google-api-python-client>=2.150",
    "google-auth>=2.36",
    "google-auth-oauthlib>=1.2",
    "slack-sdk>=3.33",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "freezegun>=1.5",
    "ruff>=0.7",
    "pyright>=1.1.390",
    "types-pyyaml>=6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: hits real external services (OpenAI, Vapi, ...); skipped by default"]
addopts = "-m 'not live' --strict-markers"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT", "RET", "TRY", "DTZ", "N"]
ignore = [
    "TRY003",  # long messages in exception constructors are fine for domain errors
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pyright]
include = ["app", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
